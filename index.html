<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jeopardy Live Show - Sincronización en Tiempo Real</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jeopardy: {
              blue: '#060CE9',
              dark: '#000533',
              gold: '#FFCC00',
              accent: '#D4AF37'
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Cinzel:wght@700;900&family=Bebas+Neue&family=Teko:wght@600;700&display=swap" rel="stylesheet">

  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase App, Realtime Database & Firestore CDN (Compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    input, textarea, select { user-select: auto !important; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-bebas { font-family: 'Bebas Neue', cursive; }
    .font-teko { font-family: 'Teko', sans-serif; }

    @keyframes clue-zoom-in {
      0% { opacity: 0; transform: scale(0.7) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-clue-zoom { animation: clue-zoom-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .tv-studio-frame {
      background: linear-gradient(165deg, #2b354d 0%, #131b2e 30%, #080d1a 70%, #030612 100%);
      border: 4px solid #475569;
      box-shadow: 
        0 0 0 2px #d4af37,
        0 0 0 5px #1e293b,
        0 25px 60px rgba(0, 0, 0, 0.9),
        0 0 50px rgba(6, 12, 233, 0.3);
    }

    .buzzer-dome-red {
      background: radial-gradient(circle at 36% 28%, #ff8a8a 0%, #ef4444 35%, #b91c1c 70%, #7f1d1d 95%, #450a0a 100%);
      box-shadow: 0 14px 0 #5c0e0e, 0 20px 30px rgba(0, 0, 0, 0.9), 0 0 35px rgba(239, 68, 68, 0.6);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .buzzer-dome-red:active {
      transform: translateY(10px) scale(0.98);
      box-shadow: 0 4px 0 #5c0e0e, 0 8px 18px rgba(0, 0, 0, 0.9);
    }

    .buzzer-disabled {
      background: radial-gradient(circle at 36% 28%, #64748b 0%, #475569 50%, #1e293b 100%) !important;
      box-shadow: 0 8px 0 #0f172a, 0 10px 20px rgba(0, 0, 0, 0.6) !important;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .glossy-clue-card {
      position: relative;
      overflow: hidden;
      transition: all 0.15s ease;
    }
    .glossy-clue-card:hover {
      transform: scale(1.03);
      filter: brightness(1.15);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
    }

    .answered-card {
      background: #02061f !important;
      border-color: #0c163b !important;
      cursor: not-allowed !important;
      opacity: 0.25 !important;
    }
  </style>
</head>
<body class="bg-[#000533] text-white antialiased min-h-screen">
  <div id="auth-root"></div>
  <div id="app" class="min-h-screen flex flex-col"></div>

  <script>
    (function() {
      const STORAGE_KEY = 'jeopardy_state';
      const AUTH_KEY = 'auth_token_jeopardy';

      // Parámetros de URL
      const urlParams = new URLSearchParams(window.location.search);
      let assignedTeamId = urlParams.get('team') || null;
      let currentRole = (urlParams.get('role') === 'player' || assignedTeamId !== null) ? 'player' : 'host';

      // Credenciales Firebase
      const _k1 = "AIzaSyDaeedSq8IQ";
      const _k2 = "NifS3DutUGm4jRJmANmhBSE";
      const firebaseConfig = {
        apiKey: _k1 + _k2,
        authDomain: "jeopardyjrh.firebaseapp.com",
        databaseURL: "https://jeopardyjrh-default-rtdb.firebaseio.com",
        projectId: "jeopardyjrh",
        storageBucket: "jeopardyjrh.firebasestorage.app",
        messagingSenderId: "299331613996",
        appId: "1:299331613996:web:a4667fcebc645394dbe889"
      };

      let fbDb = null;
      let fbFs = null;
      let serverTimeOffset = 0;

      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        fbDb = firebase.database();
        fbFs = firebase.firestore();
      } catch (err) {
        console.warn('Firebase error:', err);
      }

      // --- MÓDULO DE AUTENTICACIÓN FIRESTORE ---
      let authSession = null;
      let authModalState = {
        activeTab: 'login', // 'login' | 'redeem'
        redeemStep: 'code', // 'code' | 'register'
        licenseCode: '',
        expirationText: '',
        regEmail: '',
        regPassword: '',
        loginEmail: '',
        loginPassword: '',
        isLoading: false,
        errorMessage: null
      };

      function initAuthSession() {
        try {
          const raw = localStorage.getItem(AUTH_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.identifier) {
              authSession = parsed;
            }
          }
        } catch (e) {
          localStorage.removeItem(AUTH_KEY);
        }
      }

      function getDeviceId() {
        let deviceId = localStorage.getItem('app_device_id');
        if (!deviceId) {
          deviceId = 'dev_' + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
          localStorage.setItem('app_device_id', deviceId);
        }
        return deviceId;
      }

      function renderAuthModal() {
        const container = document.getElementById('auth-root');
        if (!container) return;

        // Si es alumno o el host ya está autenticado, no renderiza el modal
        if (currentRole === 'player' || authSession !== null) {
          container.innerHTML = '';
          return;
        }

        container.innerHTML = `
          <div id="modal-validacion-acceso" style="background-color: #0f172a;" class="fixed inset-0 z-[100000] flex items-center justify-center p-4 overflow-y-auto select-none backdrop-blur-md">
            <div id="tarjeta-central-acceso" style="background-color: #1e293b;" class="w-full max-w-md rounded-2xl sm:rounded-3xl border border-[#334155] shadow-2xl p-6 sm:p-8 flex flex-col items-center text-center relative overflow-hidden transition-all">
              <div class="absolute -top-20 left-1/2 -translate-x-1/2 w-64 h-64 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

              <div class="w-14 h-14 rounded-2xl bg-sky-500/15 border border-sky-400/30 flex items-center justify-center text-[#38bdf8] mb-4 shadow-inner">
                <i data-lucide="shield-check" class="w-7 h-7 text-[#38bdf8]"></i>
              </div>

              <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase bg-sky-500/10 text-[#38bdf8] border border-sky-500/20 mb-3">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span>Acceso y Validación Docente</span>
              </div>

              <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight mb-2">Control de Acceso al Concurso</h1>
              <p class="text-xs sm:text-sm text-slate-300 mb-6 max-w-xs leading-relaxed">
                Ingresa con tus credenciales de docente o activa una nueva licencia institucional.
              </p>

              <!-- Tabs -->
              <div class="w-full grid grid-cols-2 p-1 bg-[#0f172a] rounded-xl border border-[#334155] mb-6">
                <button type="button" id="tab-btn-login" class="py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                  authModalState.activeTab === 'login'
                    ? 'bg-[#1e293b] text-white shadow-md border border-[#334155]'
                    : 'text-slate-400 hover:text-slate-200'
                }">
                  <i data-lucide="mail" class="w-4 h-4 text-[#38bdf8]"></i>
                  <span>Iniciar Sesión</span>
                </button>

                <button type="button" id="tab-btn-redeem" class="py-2 px-3 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                  authModalState.activeTab === 'redeem'
                    ? 'bg-[#1e293b] text-white shadow-md border border-[#334155]'
                    : 'text-slate-400 hover:text-slate-200'
                }">
                  <i data-lucide="key-round" class="w-4 h-4 text-[#38bdf8]"></i>
                  <span>Canjear Licencia</span>
                </button>
              </div>

              <!-- Error Box -->
              ${authModalState.errorMessage ? `
                <div class="w-full mb-4 p-3 bg-red-950/60 border border-red-700/80 rounded-xl text-red-200 text-xs font-semibold flex items-start gap-2.5 text-left">
                  <i data-lucide="alert-circle" class="w-4 h-4 text-red-400 shrink-0 mt-0.5"></i>
                  <span class="flex-1 leading-snug">${escapeHtml(authModalState.errorMessage)}</span>
                </div>
              ` : ''}

              <!-- Tab 1: Login -->
              ${authModalState.activeTab === 'login' ? `
                <form id="auth-login-form" class="w-full space-y-4">
                  <div class="text-left">
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Correo Electrónico</label>
                    <input id="login-input-email" type="email" value="${escapeHtml(authModalState.loginEmail)}" placeholder="docente@ejemplo.com" ${authModalState.isLoading ? 'disabled' : ''} style="background-color: #0f172a;" class="w-full border border-[#334155] focus:border-[#38bdf8] focus:ring-2 focus:ring-[#38bdf8]/30 text-white text-sm py-2.5 px-3.5 rounded-xl outline-none placeholder:text-slate-500 transition-all" required />
                  </div>
                  <div class="text-left">
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Contraseña</label>
                    <input id="login-input-password" type="password" value="${escapeHtml(authModalState.loginPassword)}" placeholder="••••••••" ${authModalState.isLoading ? 'disabled' : ''} style="background-color: #0f172a;" class="w-full border border-[#334155] focus:border-[#38bdf8] focus:ring-2 focus:ring-[#38bdf8]/30 text-white text-sm py-2.5 px-3.5 rounded-xl outline-none placeholder:text-slate-500 transition-all" required />
                  </div>
                  <button type="submit" ${authModalState.isLoading ? 'disabled' : ''} class="w-full py-3 px-5 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-[0.99] text-slate-950 font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-lg shadow-sky-500/25 disabled:opacity-50 cursor-pointer">
                    ${authModalState.isLoading ? `
                      <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-slate-950"></i>
                      <span>Verificando credenciales...</span>
                    ` : `
                      <i data-lucide="lock" class="w-4 h-4 text-slate-950"></i>
                      <span>Iniciar Sesión</span>
                    `}
                  </button>
                </form>
              ` : `
                <!-- Tab 2: Redeem -->
                ${authModalState.redeemStep === 'code' ? `
                  <form id="auth-verify-code-form" class="w-full space-y-4">
                    <div class="text-left">
                      <label class="block text-xs font-semibold text-slate-300 mb-1.5">Código de Activación</label>
                      <input id="redeem-input-code" type="text" value="${escapeHtml(authModalState.licenseCode)}" placeholder="SUB-XXXXXX" ${authModalState.isLoading ? 'disabled' : ''} style="background-color: #0f172a;" class="w-full border border-[#334155] focus:border-[#38bdf8] focus:ring-2 focus:ring-[#38bdf8]/30 text-sky-300 font-mono text-center text-base sm:text-lg tracking-widest uppercase font-bold py-3 px-4 rounded-xl outline-none placeholder:text-slate-600 placeholder:normal-case placeholder:font-normal placeholder:tracking-normal transition-all" required />
                      <p class="text-[11px] text-slate-400 mt-1.5 text-center">Ingresa el código único para verificar su vigencia.</p>
                    </div>
                    <button type="submit" ${authModalState.isLoading ? 'disabled' : ''} class="w-full py-3 px-5 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-[0.99] text-slate-950 font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-lg shadow-sky-500/25 disabled:opacity-50 cursor-pointer">
                      ${authModalState.isLoading ? `
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-slate-950"></i>
                        <span>Verificando código...</span>
                      ` : `
                        <i data-lucide="arrow-right" class="w-4 h-4 text-slate-950"></i>
                        <span>Continuar al Registro</span>
                      `}
                    </button>
                  </form>
                ` : `
                  <form id="auth-register-form" class="w-full space-y-4 text-left">
                    <div class="p-3.5 bg-emerald-950/40 border border-emerald-500/40 rounded-xl flex items-center gap-3">
                      <i data-lucide="calendar" class="w-5 h-5 text-emerald-400 shrink-0"></i>
                      <div class="text-left text-xs">
                        <p class="font-bold text-emerald-300">Licencia confirmada</p>
                        <p class="text-slate-300">Vigente hasta: <strong class="text-white">${authModalState.expirationText}</strong></p>
                      </div>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1.5">Correo para tu cuenta</label>
                      <input id="register-input-email" type="email" value="${escapeHtml(authModalState.regEmail)}" placeholder="docente@ejemplo.com" ${authModalState.isLoading ? 'disabled' : ''} style="background-color: #0f172a;" class="w-full border border-[#334155] focus:border-[#38bdf8] focus:ring-2 focus:ring-[#38bdf8]/30 text-white text-sm py-2.5 px-3.5 rounded-xl outline-none placeholder:text-slate-500 transition-all" required />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-300 mb-1.5">Crea tu Contraseña</label>
                      <input id="register-input-password" type="password" value="${escapeHtml(authModalState.regPassword)}" placeholder="Mínimo 6 caracteres" ${authModalState.isLoading ? 'disabled' : ''} style="background-color: #0f172a;" class="w-full border border-[#334155] focus:border-[#38bdf8] focus:ring-2 focus:ring-[#38bdf8]/30 text-white text-sm py-2.5 px-3.5 rounded-xl outline-none placeholder:text-slate-500 transition-all" required />
                    </div>
                    <button type="submit" ${authModalState.isLoading ? 'disabled' : ''} class="w-full py-3 px-5 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-slate-950 font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-lg shadow-emerald-500/25 disabled:opacity-50 cursor-pointer">
                      ${authModalState.isLoading ? `
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-slate-950"></i>
                        <span>Creando cuenta y activando...</span>
                      ` : `
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-slate-950"></i>
                        <span>Activar Cuenta y Entrar</span>
                      `}
                    </button>
                  </form>
                `}
              `}

              <div class="mt-6 pt-4 border-t border-[#334155] w-full flex flex-col sm:flex-row items-center justify-between text-[11px] text-slate-400 gap-1.5">
                <span>¿Eres alumno con enlace de sala?</span>
                <span class="text-[#38bdf8] font-medium">Acceso directo sin contraseña</span>
              </div>
            </div>
          </div>
        `;

        if (window.lucide) window.lucide.createIcons();

        // Eventos Modal
        document.getElementById('tab-btn-login')?.addEventListener('click', () => {
          authModalState.activeTab = 'login';
          authModalState.errorMessage = null;
          renderAuthModal();
        });

        document.getElementById('tab-btn-redeem')?.addEventListener('click', () => {
          authModalState.activeTab = 'redeem';
          authModalState.redeemStep = 'code';
          authModalState.errorMessage = null;
          renderAuthModal();
        });

        const loginForm = document.getElementById('auth-login-form');
        if (loginForm) {
          loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = (document.getElementById('login-input-email')).value.trim().toLowerCase();
            const passInput = (document.getElementById('login-input-password')).value;
            authModalState.loginEmail = emailInput;
            authModalState.loginPassword = passInput;

            if (!emailInput || !passInput) {
              authModalState.errorMessage = 'Ingresa tu correo y contraseña.';
              renderAuthModal();
              return;
            }

            if (!fbFs) {
              authModalState.errorMessage = 'Base de datos Firestore no inicializada.';
              renderAuthModal();
              return;
            }

            authModalState.isLoading = true;
            authModalState.errorMessage = null;
            renderAuthModal();

            try {
              const docSnap = await fbFs.collection('usuarios').doc(emailInput).get();
              if (!docSnap.exists) {
                authModalState.errorMessage = 'Usuario no registrado. Si tienes una licencia, canjéala en la otra pestaña.';
                authModalState.isLoading = false;
                renderAuthModal();
                return;
              }

              const data = docSnap.data();
              if (data.password !== passInput) {
                authModalState.errorMessage = 'Contraseña incorrecta.';
                authModalState.isLoading = false;
                renderAuthModal();
                return;
              }

              const sessionData = {
                type: 'email',
                identifier: emailInput,
                activatedAt: Date.now()
              };
              localStorage.setItem(AUTH_KEY, JSON.stringify(sessionData));
              authSession = sessionData;
              renderAuthModal();
              render();
            } catch (err) {
              authModalState.errorMessage = err.message || 'Error de autenticación.';
              authModalState.isLoading = false;
              renderAuthModal();
            }
          });
        }

        const verifyForm = document.getElementById('auth-verify-code-form');
        if (verifyForm) {
          verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawCode = (document.getElementById('redeem-input-code')).value.replace(/\s+/g, '').toUpperCase();
            authModalState.licenseCode = rawCode;

            if (!rawCode) {
              authModalState.errorMessage = 'Por favor, ingresa tu código de activación.';
              renderAuthModal();
              return;
            }

            if (!fbFs) {
              authModalState.errorMessage = 'Base de datos Firestore no inicializada.';
              renderAuthModal();
              return;
            }

            authModalState.isLoading = true;
            authModalState.errorMessage = null;
            renderAuthModal();

            try {
              const docSnap = await fbFs.collection('suscripciones').doc(rawCode).get();
              if (!docSnap.exists) {
                authModalState.errorMessage = 'El código ingresado no existe en el sistema.';
                authModalState.isLoading = false;
                renderAuthModal();
                return;
              }

              const data = docSnap.data();
              if (data.activo === false || data.usado === true || (data.usadoPor && data.usadoPor.trim() !== '')) {
                authModalState.errorMessage = 'Este código de activación ya fue utilizado o se encuentra inactivo.';
                authModalState.isLoading = false;
                renderAuthModal();
                return;
              }

              const dias = typeof data.duracionDias === 'number' ? data.duracionDias : 30;
              const fechaFin = new Date();
              fechaFin.setDate(fechaFin.getDate() + dias);
              authModalState.expirationText = fechaFin.toLocaleDateString('es-MX', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
              });

              authModalState.redeemStep = 'register';
              authModalState.isLoading = false;
              renderAuthModal();
            } catch (err) {
              authModalState.errorMessage = err.message || 'Error al validar el código.';
              authModalState.isLoading = false;
              renderAuthModal();
            }
          });
        }

        const regForm = document.getElementById('auth-register-form');
        if (regForm) {
          regForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const cleanEmail = (document.getElementById('register-input-email')).value.trim().toLowerCase();
            const cleanPass = (document.getElementById('register-input-password')).value;
            authModalState.regEmail = cleanEmail;
            authModalState.regPassword = cleanPass;

            if (!cleanEmail || !cleanPass) {
              authModalState.errorMessage = 'Completa el correo y la contraseña para crear tu acceso.';
              renderAuthModal();
              return;
            }

            if (cleanPass.length < 6) {
              authModalState.errorMessage = 'La contraseña debe tener al menos 6 caracteres.';
              renderAuthModal();
              return;
            }

            authModalState.isLoading = true;
            authModalState.errorMessage = null;
            renderAuthModal();

            try {
              const userRef = fbFs.collection('usuarios').doc(cleanEmail);
              const userSnap = await userRef.get();

              if (userSnap.exists) {
                authModalState.errorMessage = 'Este correo ya está registrado. Inicia sesión en la pestaña principal.';
                authModalState.isLoading = false;
                renderAuthModal();
                return;
              }

              const deviceId = getDeviceId();
              const sanitizedCode = authModalState.licenseCode;
              const nowISO = new Date().toISOString();

              await userRef.set({
                correo: cleanEmail,
                password: cleanPass,
                codigoUsado: sanitizedCode,
                deviceIdAutorizado: deviceId,
                registradoEl: nowISO
              });

              await fbFs.collection('suscripciones').doc(sanitizedCode).update({
                usado: true,
                usadoPor: cleanEmail,
                fechaActivacion: nowISO
              });

              const sessionData = {
                type: 'email',
                identifier: cleanEmail,
                activatedAt: Date.now()
              };
              localStorage.setItem(AUTH_KEY, JSON.stringify(sessionData));
              authSession = sessionData;
              renderAuthModal();
              render();
            } catch (err) {
              authModalState.errorMessage = err.message || 'Error al registrar usuario y activar licencia.';
              authModalState.isLoading = false;
              renderAuthModal();
            }
          });
        }
      }

      // --- ESTRUCTURA Y LÓGICA DE JEOPARDY ---
      const DEFAULT_TEAMS_TEMPLATE = [
        { id: 'azul', name: 'Equipo Azul', color: '#2563EB', score: 0, members: [] },
        { id: 'rojo', name: 'Equipo Rojo', color: '#DC2626', score: 0, members: [] },
        { id: 'verde', name: 'Equipo Verde', color: '#16A34A', score: 0, members: [] },
        { id: 'amarillo', name: 'Equipo Amarillo', color: '#CA8A04', score: 0, members: [] },
        { id: 'morado', name: 'Equipo Morado', color: '#9333EA', score: 0, members: [] }
      ];

      const DEFAULT_CATEGORIES = [
        {
          id: 'cat-1', title: 'Historia',

      class SoundSynthesizer {
        constructor() { this.ctx = null; }
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        }
        playTick() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.09);
        }
        playSelect() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587, now);
          osc.frequency.exponentialRampToValueAtTime(1174, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
        }
        playClueOpen() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [233, 293, 349, 466, 587, 700].forEach((freq, idx) => {
            const st = now + idx * 0.05;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, st);
            gain.gain.setValueAtTime(0.2, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(st); osc.stop(st + 0.32);
          });
        }
        playBuzz() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [1046, 1567, 2093].forEach(freq => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.62);
          });
        }
        playCorrect() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523, 659, 783, 1046].forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.2, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.32);
          });
        }
        playWrong() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [98, 138].forEach(f => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.32);
          });
        }
      }

      function setupFirebaseSync() {
        if (!fbDb) return;

        fbDb.ref('.info/serverTimeOffset').on('value', (snap) => {
          serverTimeOffset = snap.val() || 0;
        });

        fbDb.ref('sessions/jeopardy_game/globalReset').on('value', (snap) => {
          if (snap.val() === true) {
            localStorage.clear();
            sessionStorage.clear();
            try { window.close(); } catch (e) {}
            location.href = window.location.pathname;
          }
        });

        fbDb.ref('jeopardy_game/teams').on('value', (snap) => {
          const val = snap.val() || {};
          state.teams.forEach(team => {
            const tData = val[team.id];
            if (tData && tData.players) {
              team.members = Object.values(tData.players);
            } else {
              team.members = [];
            }
          });
          updateLiveParticipantsDOM();
        });

        fbDb.ref('sessions/jeopardy_game').on('value', (snap) => {
          const session = snap.val() || {};
          const prevTurn = state.currentTurn;
          const prevUnlocked = state.buzzersUnlocked;

          state.activeClue = session.activeClue || null;
          state.currentTurn = session.activeTurn || null;
          state.buzzQueue = session.buzzQueue ? Object.values(session.buzzQueue).sort((a,b) => a.timestamp - b.timestamp) : [];
          state.disqualifiedTeams = session.disqualifiedTeams || [];
          state.buzzersUnlocked = Boolean(session.buzzersUnlocked);
          state.loadingDevicesState = session.loadingDevicesState !== undefined ? Boolean(session.loadingDevicesState) : true;
          if (session.status) state.status = session.status;

          if (!prevUnlocked && state.buzzersUnlocked && currentRole === 'player') {
            sound.playSelect();
          }

          if (state.currentTurn && (!prevTurn || prevTurn.playerId !== state.currentTurn.playerId) && currentRole === 'host') {
            sound.playBuzz();
          }

          render();
        });
      }

      function updateLiveParticipantsDOM() {
        if (currentRole !== 'host') return;
        const activeTeams = state.teams.slice(0, state.teamCount);
        let total = 0;

        activeTeams.forEach(team => {
          const membersList = team.members ? (Array.isArray(team.members) ? team.members : Object.values(team.members)) : [];
          const count = membersList.length;
          total += count;

          ['setup', 'qr'].forEach(prefix => {
            const countEl = document.getElementById(`${prefix}-team-count-${team.id}`);
            if (countEl) countEl.textContent = `${count} / ${state.maxMembersPerTeam} registrados`;

            const listEl = document.getElementById(`${prefix}-team-members-${team.id}`);
            if (listEl) {
              if (count === 0) {
                listEl.innerHTML = `<span class="text-[10px] text-blue-400/60 italic py-1 block text-center">Esperando...</span>`;
              } else {
                listEl.innerHTML = membersList.map(m => `
                  <div class="text-xs font-semibold text-gray-200 flex justify-between items-center py-0.5 border-b border-gray-800/50">
                    <span class="truncate">${escapeHtml(m.name)}</span>
                    <span class="text-green-400 text-[10px]">● Conectado</span>
                  </div>
                `).join('');
              }
            }

        const totalSetup = document.getElementById('setup-total-connected-count');
        if (totalSetup) totalSetup.textContent = `${total} Conectados`;

        if (totalQr) totalQr.textContent = String(total);

      function openClue(catId, clueId) {
        const cat = state.categories.find(c => c.id === catId);
        const clue = cat?.clues.find(cl => cl.id === clueId);
        if (!clue || clue.isAnswered) return;

        state.activeClue = { ...clue, categoryTitle: cat.title, catId: cat.id };
        state.loadingDevicesState = true;
        state.currentTurn = null;
        state.buzzQueue = [];
        state.disqualifiedTeams = [];
        state.buzzersUnlocked = true;

        sound.playSelect();

        if (fbDb) {
          fbDb.ref('sessions/jeopardy_game').update({
            activeClue: state.activeClue,
            activeTurn: null,
            buzzQueue: null,
            disqualifiedTeams: null,
            buzzersUnlocked: true,
            loadingDevicesState: true
          });
        }
        persistState(state);
      }

      function deployQuestion() {
        state.loadingDevicesState = false;
        sound.playClueOpen();

        if (fbDb) {
          fbDb.ref('sessions/jeopardy_game').update({
            loadingDevicesState: false,
            buzzersUnlocked: true
          });
        }
        persistState(state);
      }

      function handleAnswerEvaluation(isCorrect) {
        if (!state.activeClue || !state.currentTurn) return;

        const currentTurn = state.currentTurn;
        const clueVal = state.activeClue.value;
        const team = state.teams.find(t => t.id === currentTurn.teamId);

        if (isCorrect) {
          if (team) team.score += clueVal;
          sound.playCorrect();
          if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });

          const cat = state.categories.find(c => c.id === state.activeClue.catId);
          const cl = cat?.clues.find(x => x.id === state.activeClue.id);
          if (cl) cl.isAnswered = true;

          state.activeClue = null;
          state.loadingDevicesState = true;
          state.currentTurn = null;
          state.buzzQueue = [];
          state.disqualifiedTeams = [];
          state.buzzersUnlocked = false;

          if (fbDb) {
            fbDb.ref('jeopardy_game/teams').set(state.teams);
            fbDb.ref('sessions/jeopardy_game').update({
              activeClue: null,
              activeTurn: null,
              buzzQueue: null,
              disqualifiedTeams: null,
              buzzersUnlocked: false,
              loadingDevicesState: true
            });
          }
          persistState(state);
        } else {
          if (team) team.score -= clueVal;
          sound.playWrong();

          const disq = [...(state.disqualifiedTeams || [])];
          if (!disq.includes(currentTurn.teamId)) disq.push(currentTurn.teamId);
          state.disqualifiedTeams = disq;

          const remainingQueue = (state.buzzQueue || []).filter(item => !disq.includes(item.teamId));

          if (remainingQueue.length > 0) {
            const nextTurn = remainingQueue.shift();
            state.currentTurn = nextTurn;
            state.buzzQueue = remainingQueue;

            if (fbDb) {
              fbDb.ref('jeopardy_game/teams').set(state.teams);
              fbDb.ref('sessions/jeopardy_game/activeTurn').set(nextTurn);
              fbDb.ref('sessions/jeopardy_game/buzzQueue').set(remainingQueue);
              fbDb.ref('sessions/jeopardy_game/disqualifiedTeams').set(disq);
            }
          } else {
            state.currentTurn = null;
            state.buzzQueue = [];

            if (fbDb) {
              fbDb.ref('jeopardy_game/teams').set(state.teams);
              fbDb.ref('sessions/jeopardy_game/activeTurn').remove();
              fbDb.ref('sessions/jeopardy_game/buzzQueue').remove();
              fbDb.ref('sessions/jeopardy_game/disqualifiedTeams').set(disq);
              fbDb.ref('sessions/jeopardy_game/buzzersUnlocked').set(true);
            }
          }
          persistState(state);
        }
      }

      function cancelActiveClue() {
        if (!state.activeClue) return;
        const cat = state.categories.find(c => c.id === state.activeClue.catId);
        const cl = cat?.clues.find(x => x.id === state.activeClue.id);

        state.activeClue = null;
        state.loadingDevicesState = true;
        state.currentTurn = null;

            buzzQueue: null,
            disqualifiedTeams: null,
            buzzersUnlocked: false,

          });

      function handleCSVUpload(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const text = e.target.result;
          const lines = text.split(/\r\n|\n/).filter(line => line.trim().length > 0);
          if (lines.length < 2) {
            alert("El archivo CSV no contiene suficientes filas.");
            return;
          }

          const delimiter = lines[0].includes(';') ? ';' : ',';
          const newCategoriesMap = {};

          for (let i = 1; i < lines.length; i++) {
            const parts = parseCSVLine(lines[i], delimiter);
            if (parts.length >= 4) {
              const catName = parts[0].trim();
              const val = parseInt(parts[1].trim().replace(/[^0-9]/g, ''), 10) || 100;
              const q = parts[2].trim();
              const a = parts[3].trim();

              if (!newCategoriesMap[catName]) newCategoriesMap[catName] = [];
              newCategoriesMap[catName].push({
                id: `c-upload-${i}`,
                value: val,
                question: q,
                answer: a,
                isAnswered: false
              });
            }
          }

          const catKeys = Object.keys(newCategoriesMap);
          if (catKeys.length === 0) {
            alert("No se pudieron extraer categorías del archivo.");
            return;
          }

          state.categories = catKeys.slice(0, 5).map((catName, idx) => ({
            id: `cat-up-${idx + 1}`,
            title: catName,
            clues: newCategoriesMap[catName].sort((a, b) => a.value - b.value).slice(0, 5)
          }));

          persistState(state);
          sound.playCorrect();
          alert(`¡Preguntas cargadas con éxito! ${state.categories.length} categorías registradas.`);
        };
        reader.readAsText(file, 'UTF-8');
      }

      function parseCSVLine(text, delimiter) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (c === '"') inQuotes = !inQuotes;
          else if (c === delimiter && !inQuotes) { result.push(cur); cur = ''; }
          else cur += c;
        }
        result.push(cur);
        return result;
      }

      function persistState(newState) {
        newState.lastUpdated = Date.now();
        state = newState;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        if (fbDb && currentRole === 'host') {
          fbDb.ref('sessions/jeopardy_game/status').set(newState.status);
        }
        render();
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

        if (currentRole === 'host' && !authSession) {

          renderAuthModal();
          return;
        }

        if (currentRole === 'player') {

        }

        if (state.status === 'setup') {
          renderSetupScreen(app);
          return;
        }

        if (state.status === 'qrcodes') {

      }

      // 5. VISTA MÓVIL DEL PARTICIPANTE
      function renderPlayerView(container) {
        let myTeamId = assignedTeamId || localStorage.getItem('jeopardy_player_team') || 'azul';
        let myName = localStorage.getItem('jeopardy_player_name') || '';
        let myId = localStorage.getItem('jeopardy_player_id') || '';

        if (!myName) {
          container.innerHTML = `
            <div class="min-h-screen bg-[#000533] p-4 flex items-center justify-center">
              <div class="w-full max-w-sm bg-[#000842] border-4 border-[#FFCC00] rounded-3xl p-6 text-center space-y-4">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-[#060CE9] border-2 border-[#FFCC00] flex items-center justify-center font-cinzel text-3xl font-black text-[#FFCC00]">J!</div>
                <h2 class="text-xl font-black text-white uppercase font-cinzel">Registro de Concursante</h2>
                <div class="p-2.5 rounded-xl bg-blue-950 border border-blue-600">
                  <span class="text-xs uppercase text-blue-300 font-bold">Equipo:</span>
                  <span class="text-base font-black text-[#FFCC00] uppercase block">${myTeamId}</span>
                </div>
                <form id="mobile-join-form" class="space-y-4 text-left">
                  <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1">Tu Nombre:</label>
                    <input id="mobile-name" type="text" required placeholder="Escribe tu nombre..." class="w-full p-3.5 rounded-xl bg-[#000324] border-2 border-blue-500 text-white font-bold" />
                  </div>
                  <button type="submit" class="w-full py-3.5 bg-[#FFCC00] text-[#000533] font-black uppercase rounded-xl hover:bg-yellow-400">Entrar al Juego</button>
                </form>
              </div>
            </div>
          `;

          document.getElementById('mobile-join-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('mobile-name').value.trim();
            if (!name) return;
            const pId = 'p-' + Date.now();

            localStorage.setItem('jeopardy_player_name', name);
            localStorage.setItem('jeopardy_player_team', myTeamId);
            localStorage.setItem('jeopardy_player_id', pId);

            if (fbDb) {
              const pData = { id: pId, name: name, timestamp: Date.now() };
              fbDb.ref(`jeopardy_game/teams/${myTeamId}/players/${pId}`).set(pData);
            }
            sound.playSelect();
            render();
          });
          return;
        }

        if (state.status === 'podium_teams') {
          container.innerHTML = `
            <div class="min-h-screen bg-[#000533] p-6 flex flex-col justify-center items-center text-center space-y-4">
              <div class="w-20 h-20 rounded-2xl bg-[#060CE9] border-2 border-[#FFCC00] flex items-center justify-center font-cinzel text-4xl font-black text-[#FFCC00] shadow-lg">🏆</div>
              <h2 class="text-2xl font-black text-[#FFCC00] uppercase font-cinzel">¡Juego Finalizado!</h2>
              <p class="text-sm text-blue-200">Consulta los resultados y podium en la pantalla principal del profesor.</p>
              <button onclick="localStorage.clear();location.reload();" class="mt-6 px-6 py-3 bg-blue-900 border border-blue-500 rounded-xl text-xs font-bold uppercase text-white">Salir de la Sesión</button>
            </div>
          `;
          return;
        }

        const isDisqualified = (state.disqualifiedTeams || []).includes(myTeamId);
        const didIWin = state.currentTurn?.playerId === myId;
        const someoneFromMyTeamInQueue = (state.currentTurn?.teamId === myTeamId) || 
          (state.buzzQueue || []).some(q => q.teamId === myTeamId);

        const isBuzzerOpen = state.activeClue !== null && state.buzzersUnlocked && !isDisqualified && !someoneFromMyTeamInQueue;

        let statusMessage = "Esperando pregunta en el tablero...";
        if (state.activeClue && state.loadingDevicesState) {
          statusMessage = "● ¡PULSADORES ACTIVOS! (Espera la pregunta)";
        } else if (didIWin) {
          statusMessage = "¡TIENES EL TURNO! RESPONDE EN VOZ ALTA";
        } else if (someoneFromMyTeamInQueue) {
          statusMessage = "¡Tu equipo ya pulsó el botón! Esperando respuesta...";
        } else if (isDisqualified) {
          statusMessage = "Tu equipo falló esta pregunta. Bloqueado en esta ronda.";
        } else if (isBuzzerOpen) {
          statusMessage = "● ¡TIMBRE LIBRE! ¡PULSA AHORA!";
        }

        container.innerHTML = `
          <div class="min-h-screen bg-[#000533] p-4 flex flex-col justify-between items-center text-center">
            <div class="pt-4 space-y-1">
              <span class="text-xs uppercase font-bold text-blue-300 block">Equipo: <strong class="text-white">${myTeamId.toUpperCase()}</strong></span>
              <span class="text-lg font-black text-[#FFCC00] block">${myName}</span>
              <span class="text-xs font-black uppercase block ${
                didIWin ? 'text-emerald-400 animate-bounce' : 
                (isBuzzerOpen ? 'text-emerald-400' : (isDisqualified ? 'text-rose-400' : 'text-blue-300'))
              }">${statusMessage}</span>
            </div>

            <div class="my-auto py-6">
              <button
                id="mobile-buzzer-btn"
                ${!isBuzzerOpen ? 'disabled' : ''}
                class="w-64 h-64 rounded-full ${isBuzzerOpen ? 'buzzer-dome-red border-4 border-yellow-300 active:scale-95' : 'buzzer-disabled border-4 border-slate-700'} font-cinzel font-black text-3xl uppercase text-white shadow-2xl flex flex-col items-center justify-center transition-all"
              >
                <span class="text-4xl mb-1">${isBuzzerOpen ? '⚡' : '🔒'}</span>
                <span>PULSAR</span>
              </button>
            </div>

            <div class="pb-4">
              <button onclick="localStorage.clear();location.reload();" class="text-xs text-blue-400 underline">
                Cambiar de nombre o equipo
              </button>
            </div>
          </div>
        `;

        document.getElementById('mobile-buzzer-btn')?.addEventListener('click', () => {
          if (!isBuzzerOpen) return;
          sound.playBuzz();
          if ('vibrate' in navigator) navigator.vibrate(200);

          if (fbDb) {
            const teamObj = state.teams.find(t => t.id === myTeamId);
            const accurateTimestamp = getEstimatedServerTime();

            const buzzData = {
              playerId: myId,
              playerName: myName,
              teamId: myTeamId,
              teamName: teamObj ? teamObj.name : myTeamId,
              teamColor: teamObj ? teamObj.color : '#FFCC00',
              timestamp: accurateTimestamp
            };

            fbDb.ref('sessions/jeopardy_game/activeTurn').transaction(current => {
              if (current === null) return buzzData;
              return current;
            }, (error, committed) => {
              if (!committed) {
                fbDb.ref(`sessions/jeopardy_game/buzzQueue/${myTeamId}`).set(buzzData);
              }
            });
          }
        });
      }

      // Arranque del sistema
      initAuthSession();
      setupFirebaseSync();
      render();
    })();
  </script>
</body>
</html>
