<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy Live Show - Methaplan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App (Compat) y Realtime Database / Firestore por CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- QRCode Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone para JSX en navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
        .neon-border-blue { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.2); }
        .neon-border-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.5), inset 0 0 15px rgba(239, 68, 68, 0.2); }
        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-white font-rajdhani min-h-screen flex flex-col items-center justify-between p-4">

    <div id="root" class="w-full max-w-7xl mx-auto flex flex-col flex-grow"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuración de Firebase para Methaplan
        const firebaseConfig = {
          apiKey: "AIzaSyAqaZGZDYqxmPYfaOVgDIYRi7eZx4CQ4YA",
          authDomain: "methaplan.firebaseapp.com",
          projectId: "methaplan",
          storageBucket: "methaplan.firebasestorage.app",
          messagingSenderId: "1056430443532",
          appId: "1:1056430443532:web:3548dbae8bb25ed6ea3229"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function App() {
            const [gameState, setGameState] = useState({ status: 'live', teams: { azul: { players: {} }, rojo: { players: {} } } });
            const [activeTab, setActiveTab] = useState('host');
            const urlParams = new URLSearchParams(window.location.search);
            const teamParam = urlParams.get('team');
            const [playerName, setPlayerName] = useState('');
            const [registered, setRegistered] = useState(false);

            useEffect(() => {
                // Sincronización en tiempo real con Firestore bajo ruta limpia /jeopardy_game/main
                const unsubscribe = db.collection("jeopardy_game").doc("main").onSnapshot((doc) => {
                    if (doc.exists) {
                        setGameState(doc.data());
                    } else {
                        // Inicializar documento por defecto si no existe
                        const initialState = {
                            status: 'live',
                            teams: {
                                azul: { name: 'EQUIPO AZUL', players: {} },
                                rojo: { name: 'EQUIPO ROJO', players: {} }
                            }
                        };
                        db.collection("jeopardy_game").doc("main").set(initialState);
                    }
                });
                return () => unsubscribe();
            }, []);

            const handleRegisterPlayer = (e) => {
                e.preventDefault();
                if (!playerName.trim() || !teamParam) return;
                const playerId = 'player_' + Math.random().toString(36.substring(2, 9));
                
                db.collection("jeopardy_game").doc("main").set({
                    ...gameState,
                    teams: {
                        ...gameState.teams,
                        [teamParam]: {
                            ...gameState.teams[teamParam],
                            players: {
                                ...(gameState.teams[teamParam]?.players || {}),
                                [playerId]: { id: playerId, name: playerName.trim(), timestamp: Date.now() }
                            }
                        }
                    }
                }, { merge: true }).then(() => {
                    setRegistered(true);
                });
            };

            // Vista móvil de registro por QR
            if (teamParam) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-[85vh] text-center p-6">
                        <div className="bg-slate-900 border border-blue-500/50 p-8 rounded-2xl neon-border-blue max-w-md w-full">
                            <h1 className="font-orbitron text-2xl font-bold mb-2 text-blue-400">JEOPARDY LIVE</h1>
                            <p className="text-slate-400 mb-6 uppercase tracking-wider text-sm">Registro para Equipo: <span className="text-white font-bold">{teamParam}</span></p>
                            
                            {!registered ? (
                                <form onSubmit={handleRegisterPlayer} className="space-y-4">
                                    <input 
                                        type="text" 
                                        placeholder="Ingresa tu Nombre" 
                                        value={playerName} 
                                        onChange={(e) => setPlayerName(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-center font-bold"
                                        required
                                    />
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-orbitron py-3 rounded-xl transition shadow-lg shadow-blue-600/30 font-bold">
                                        REGISTRARME
                                    </button>
                                </form>
                            ) : (
                                <div className="space-y-4">
                                    <div className="text-green-400 font-bold text-lg">¡Registro Exitoso!</div>
                                    <p className="text-slate-300 text-sm">Ya estás conectado en tiempo real al tablero principal. Espera la pregunta del anfitrión.</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // Vista Principal del Host / Tablero
            return (
                <div className="w-full flex flex-col space-y-6">
                    <header className="flex justify-between items-center border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="font-orbitron text-2xl md:text-3xl font-black text-blue-400 neon-text">STUDIO JEOPARDY LIVE SHOW</h1>
                            <p className="text-xs text-slate-400">Códigos QR Dinámicos • Estado: <span className="text-green-400 font-bold">EN VIVO (Methaplan)</span></p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setActiveTab('host')} className={`px-4 py-2 rounded-lg font-orbitron text-xs transition ${activeTab === 'host' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>Tablero Host</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Tarjeta Equipo Azul */}
                        <TeamCard teamKey="azul" teamData={gameState?.teams?.azul} originUrl={window.location.origin + window.location.pathname} />
                        {/* Tarjeta Equipo Rojo */}
                        <TeamCard teamKey="rojo" teamData={gameState?.teams?.rojo} originUrl={window.location.origin + window.location.pathname} />
                    </div>
                </div>
            );
        }

        // Componente de Tarjeta de Equipo con QR Dinámico
        function TeamCard({ teamKey, teamData, originUrl }) {
            const qrRef = useRef(null);
            const teamName = teamData?.name || (`EQUIPO ` + teamKey.toUpperCase());
            const playersObj = teamData?.players || {};
            const playersList = Object.values(playersObj);
            const targetUrl = `${originUrl}?team=${teamKey}`;

            useEffect(() => {
                if (qrRef.current) {
                    qrRef.current.innerHTML = "";
                    new QRCode(qrRef.current, {
                        text: targetUrl,
                        width: 180,
                        height: 180,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            }, [targetUrl]);

            const borderClass = teamKey === 'azul' ? 'neon-border-blue border-blue-500/40' : 'neon-border-red border-red-500/40';
            const textHeaderClass = teamKey === 'azul' ? 'text-blue-400' : 'text-red-400';

            return (
                <div className={`bg-slate-900 border rounded-2xl p-6 flex flex-col items-center relative ${borderClass}`}>
                    <h2 className={`font-orbitron text-xl font-bold mb-1 ${textHeaderClass}`}>{teamName}</h2>
                    <p className="text-xs text-slate-400 mb-4">{playersList.length} / 5 registrados</p>
                    
                    <div className="bg-white p-3 rounded-xl shadow-inner mb-4">
                        <div ref={qrRef}></div>
                    </div>

                    <div className="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-4 flex flex-col h-36 overflow-y-auto">
                        <span className="text-xs font-orbitron text-slate-400 mb-2 border-b border-slate-800 pb-1">PARTICIPANTES:</span>
                        {playersList.length === 0 ? (
                            <span className="text-xs text-slate-500 italic my-auto text-center">Esperando participantes...</span>
                        ) : (
                            <div className="space-y-1">
                                {playersList.map((p) => (
                                    <div key={p.id} className="text-xs text-white font-bold flex justify-between items-center bg-slate-900/80 px-2 py-1 rounded">
                                        <span>{p.name}</span>
                                        <span className="text-green-400 text-[10px]">● Conectado</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
